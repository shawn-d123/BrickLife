name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Engine tests (pure, seeded, no fixtures needed)
        run: npm test

      - name: Smoke test — 400 simulated lives end to end, offline
        run: npm run smoke
